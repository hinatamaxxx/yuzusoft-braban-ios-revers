<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ぶらばん！</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="root">
  <!-- blurred copy of the live scene behind the side margins (phones) -->
  <canvas id="bgblur" width="64" height="48"></canvas>
  <div id="stage">
    <canvas id="cv"></canvas>
    <img id="dayimg" alt="">
    <div id="msg" class="hidden">
      <img id="msgframe" alt="">
      <div id="facebox"><img id="face" alt=""></div>
      <div id="name"></div>
      <div id="text"></div>
      <img id="clickwait" alt="">
      <div id="sysbtns"></div>
    </div>
    <div id="choices" class="hidden"></div>
    <div id="map" class="hidden"></div>
    <video id="movie" class="hidden" playsinline webkit-playsinline preload="auto"></video>
    <div id="hidecover" class="hidden"></div>
    <div id="title" class="hidden"></div>
    <div id="boot">
      <div class="boot-title">ぶらばん！</div>
      <div class="boot-sub">The Bandbitious Brass Band</div>
      <div class="boot-tap" id="boottap">読み込み中…</div>
    </div>
  </div>
  <!-- large touch buttons in the side margins (phones) -->
  <div id="sideL" class="side hidden"></div>
  <div id="sideR" class="side hidden"></div>
  <!-- optional corner menu (︙) -->
  <button id="cornerbtn" class="hidden" aria-label="メニュー"><span></span><span></span><span></span></button>
  <div id="cornermenu" class="hidden"></div>
  <div id="overlay" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<script src="data/manifest.js"></script>
<script src="data/scripts.js"></script>
<script src="js/tjs.js"></script>
<script src="js/ks.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/env.js"></script>
<script src="js/vm.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
